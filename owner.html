<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toto Ride | Owner Panel</title>
<style>
:root{--ink:#10251f;--lime:#b8f36b;--bg:#f3f6f1;--muted:#68766f;--line:#dfe7de}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Noto Sans Bengali",sans-serif}.wrap{width:min(900px,93%);margin:auto}header{background:var(--ink);color:white;padding:18px 0}.logo{font-size:1.3rem;font-weight:900}.logo span{color:var(--lime)}main{padding:28px 0 55px}.card{background:white;border:1px solid var(--line);border-radius:19px;padding:22px;margin-bottom:18px}h1{margin:0 0 8px}h2{margin:0 0 14px;font-size:1.25rem}label{display:block;font-weight:750;font-size:.9rem;margin:12px 0 6px}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit}.btn{border:0;border-radius:10px;background:var(--ink);color:white;font-weight:800;padding:12px 15px;cursor:pointer}.green{background:var(--lime);color:var(--ink)}.muted{color:var(--muted);font-size:.82rem;line-height:1.5}.booking{border:1px solid var(--line);border-radius:14px;padding:15px;margin:12px 0}.row{display:flex;gap:8px;align-items:end}.row>div{flex:1;min-width:0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.actions button{flex:1}.status{padding:5px 9px;border-radius:20px;background:#edf6e7;font-size:.75rem;display:inline-block;margin-top:7px}#message{margin-top:12px;padding:12px;border-radius:10px;background:#eff7e9}.hidden{display:none}footer{padding:20px 0;color:var(--muted);font-size:.8rem}@media(max-width:600px){.row{align-items:stretch;flex-direction:column}.row button{width:100%}}
</style></head><body><header><div class="wrap logo">🛺 TOTO <span>RIDE</span> — OWNER</div></header>
<main class="wrap"><section class="card"><h1>Owner Dashboard</h1><p class="muted">Owner login করে নতুন booking দেখুন, ভাড়া নির্ধারণ করুন এবং Cash payment নিশ্চিত করুন।</p>
<label>Owner Password</label><div class="row"><div><input id="password" type="password" placeholder="Admin password"></div><button class="btn green" id="login">Login</button></div><div id="message" class="hidden"></div></section>
<section class="card"><div class="row"><div><h2>Customer Bookings</h2><p class="muted">প্রতি ১০ সেকেন্ডে booking refresh হবে।</p></div><button class="btn" id="refresh">Refresh</button></div><div id="bookings"><p class="muted">Login করুন।</p></div></section></main><footer><div class="wrap">Toto Ride • Owner Panel</div></footer>
<script>
const API=(location.protocol==="file:"?"http://localhost:3000":location.origin);let token="";
const $=id=>document.getElementById(id);
function msg(t){$("message").textContent=t;$("message").classList.remove("hidden")}
async function request(path,opts={}){const res=await fetch(API+path,{...opts,headers:{"Content-Type":"application/json","Authorization":"Bearer "+token,...opts.headers}});const d=await res.json();if(!res.ok)throw Error(d.error||"Request failed");return d}
$("login").onclick=async()=>{try{const d=await fetch(API+"/api/owner/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("password").value})});const j=await d.json();if(!d.ok)throw Error(j.error);token=j.token;localStorage.setItem("totoOwnerToken",token);msg("Login সফল হয়েছে");load()}catch(e){msg("Login হয়নি: "+e.message)}};
token=localStorage.getItem("totoOwnerToken")||"";
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function load(){if(!token)return;try{const data=await request("/api/owner/bookings");const host=$("bookings");host.innerHTML="";if(!data.length){host.innerHTML='<p class="muted">এখনও কোনো booking নেই।</p>';return}
data.forEach(b=>{const el=document.createElement("div");el.className="booking";el.innerHTML=`<b>${esc(b.name)} — ${esc(b.pickup)} → ${esc(b.destination)}</b><p class="muted">Booking ID: ${b.id}<br>Phone: ${esc(b.phone)}<br>Payment: ${esc(b.payment)}<br>Notes: ${esc(b.notes)}<br>Created: ${new Date(b.createdAt).toLocaleString()}</p><span class="status">${esc(b.status)}</span><label>তুমি যে ভাড়া নির্ধারণ করবে (₹)</label><div class="row"><div><input type="number" min="1" step="1" id="fare-${b.id}" value="${b.fare??""}" placeholder="ভাড়া"></div><button class="btn green" onclick="setFare('${b.id}')">ভাড়া Customer-কে পাঠাও</button></div>${b.payment==="Cash"?`<div class="actions"><button class="btn" onclick="cash('${b.id}',true)">Cash পেয়েছি — হ্যাঁ</button><button class="btn" onclick="cash('${b.id}',false)">না</button></div><p class="muted">Cash status: ${esc(b.cashStatus||"Pending")}</p>`:""}`;host.append(el)});
}catch(e){$("bookings").innerHTML='<p class="muted">লোড করা যায়নি: '+esc(e.message)+'</p>'}}
window.setFare=async id=>{const fare=Number(document.getElementById("fare-"+id).value);if(!fare||fare<1){alert("সঠিক ভাড়া লিখুন");return}try{await request("/api/owner/bookings/"+id+"/fare",{method:"POST",body:JSON.stringify({fare})});msg("ভাড়া Customer-এর booking status-এ পাঠানো হয়েছে।");load()}catch(e){msg(e.message)}};
window.cash=async(id,received)=>{try{await request("/api/owner/bookings/"+id+"/cash",{method:"POST",body:JSON.stringify({received})});msg("Cash status update হয়েছে।");load()}catch(e){msg(e.message)}};
$("refresh").onclick=load;setInterval(load,10000);if(token)load();
</script></body></html>
